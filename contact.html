<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Contact TravelBloom – send us a message and we'll get back to you." />
  <meta name="author" content="Marcin Krupinski" />
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
  <title>Contact Us – Travel Recommendation</title>
</head>
<body>

  <!-- ── Navbar ──────────────────────────────────────────────── -->
  <nav class="navbar" role="navigation" aria-label="Main navigation">
    <div class="navbar__inner">
      <a href="index.html" class="navbar__brand" aria-label="TravelBloom home">
        <div class="navbar__brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13l-3 7 7-3 3-7-7 3z"/>
          </svg>
        </div>
        <span class="navbar__brand-name">TravelBloom</span>
      </a>

      <ul class="navbar__links" id="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="contact.html" class="active">Contact Us</a></li>
      </ul>

      <button class="navbar__hamburger" id="hamburger" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- ── Contact Page ─────────────────────────────────────────── -->
  <section class="contact-page" aria-label="Contact us">

    <!-- Background + overlay (reuses hero__bg) -->
    <div class="hero__bg" aria-hidden="true"></div>

    <!-- Social icons (same as about/home pages) -->
    <aside class="hero__socials" aria-label="Social media links">
      <a href="https://twitter.com"   target="_blank" rel="noopener" aria-label="Twitter">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M22.46 6c-.77.35-1.6.58-2.46.69a4.28 4.28 0 0 0 1.88-2.37 8.56 8.56 0 0 1-2.72 1.04 4.27 4.27 0 0 0-7.28 3.9A12.12 12.12 0 0 1 3.1 4.78a4.27 4.27 0 0 0 1.32 5.7 4.24 4.24 0 0 1-1.93-.53v.05a4.27 4.27 0 0 0 3.42 4.18 4.3 4.3 0 0 1-1.93.07 4.27 4.27 0 0 0 3.99 2.97A8.57 8.57 0 0 1 2 19.54a12.1 12.1 0 0 0 6.56 1.92c7.88 0 12.2-6.53 12.2-12.2l-.01-.56A8.72 8.72 0 0 0 22.46 6z"/></svg>
      </a>
      <a href="https://facebook.com"  target="_blank" rel="noopener" aria-label="Facebook">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
      </a>
      <a href="https://instagram.com" target="_blank" rel="noopener" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
      </a>
      <a href="https://youtube.com"   target="_blank" rel="noopener" aria-label="YouTube">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.8 8s-.2-1.4-.8-2c-.8-.8-1.6-.8-2-.9C16.4 5 12 5 12 5s-4.4 0-7 .1c-.4.1-1.2.1-2 .9-.6.6-.8 2-.8 2S2 9.6 2 11.2v1.5c0 1.6.2 3.2.2 3.2s.2 1.4.8 2c.8.8 1.8.8 2.3.9C6.8 19 12 19 12 19s4.4 0 7-.1c.4-.1 1.2-.1 2-.9.6-.6.8-2 .8-2s.2-1.6.2-3.2v-1.5C22 9.6 21.8 8 21.8 8zM9.7 14.5V9l5.4 2.8-5.4 2.7z"/></svg>
      </a>
    </aside>

    <!-- Two-column layout: title left, form right -->
    <div class="contact-page__inner">

      <!-- Left: title + subtitle -->
      <div class="contact-page__left">
        <h1 class="contact-page__title">Contact Us</h1>
        <p class="contact-page__subtitle">Get in touch</p>
      </div>

      <!-- Right: form -->
      <div class="contact-form-box">

        <div class="contact-form__group">
          <label for="contact-name">Name</label>
          <input
            type="text"
            id="contact-name"
            placeholder="Enter your name"
            required
          />
        </div>

        <div class="contact-form__group">
          <label for="contact-email">Email</label>
          <input
            type="email"
            id="contact-email"
            placeholder="Enter your email"
            required
          />
        </div>

        <div class="contact-form__group">
          <label for="contact-message">Message</label>
          <textarea
            id="contact-message"
            rows="6"
            placeholder="Enter your message"
            required
          ></textarea>
        </div>

        <button class="contact-form__submit" id="contact-submit">Submit</button>

        <p class="contact-form__success" id="contact-success">
          ✅ Thank you! Your message has been sent.
        </p>

      </div>
    </div>

  </section>

  <script>
    document.getElementById('contact-submit').addEventListener('click', () => {
      const name    = document.getElementById('contact-name').value.trim();
      const email   = document.getElementById('contact-email').value.trim();
      const message = document.getElementById('contact-message').value.trim();

      if (!name || !email || !message) {
        alert('Please fill in all fields before submitting.');
        return;
      }

      console.log('📧 Form submitted:', { name, email, message });

      document.getElementById('contact-success').style.display = 'block';
      document.getElementById('contact-name').value    = '';
      document.getElementById('contact-email').value   = '';
      document.getElementById('contact-message').value = '';
    });
  </script>

</body>
</html>
