<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Discover personalised travel recommendations tailored to your interests, budget, and travel style. Find your next destination and plan your perfect trip." />
  <meta name="author" content="Marcin Krupinski" />
   <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css" />

  <!-- JavaScript (deferred so it runs after the DOM is ready) -->
  <script src="script.js" defer></script>
  <title>Travel Recommendation</title>
</head>
    <body>
        
<nav class="navbar" role="navigation" aria-label="Main navigation">
  <div class="navbar__inner">
 
    <!-- Brand -->
    <a href="/" class="navbar__brand" aria-label="TravelBloom home">
      <div class="navbar__brand-icon" aria-hidden="true">
        <!-- Compass-style icon -->
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13l-3 7 7-3 3-7-7 3z"/>
        </svg>
      </div>
      <span class="navbar__brand-name">TravelBloom</span>
    </a>
 
    <!-- Nav links -->
    <ul class="navbar__links" id="nav-links">
      <li><a href="/" class="active">Home</a></li>
      <li><a href="/about">About Us</a></li>
      <li><a href="/contact">Contact Us</a></li>
    </ul>
 
    <!-- Search -->
    <div class="navbar__search" id="nav-search">
      <div class="search-input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/>
        </svg>
        <input
          class="search-input"
          id="search-field"
          type="search"
          placeholder="Enter a destination or keyword"
          aria-label="Search destinations"
        />
      </div>
      <button class="btn-search" onclick="handleSearch()">Search</button>
      <button class="btn-clear" onclick="clearSearch()">Clear</button>
    </div>
 
    <!-- Hamburger (mobile) -->
    <button class="navbar__hamburger" id="hamburger" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
 
  </div>
</nav>
    </body>
</html>
